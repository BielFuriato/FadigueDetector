camera:
  source: 0
  width: 1280
  height: 720
  fps: 30

thresholds:
  ear_closed: 0.21
  mar_open: 0.5
  yawn_min_duration_sec: 1.0
  long_eye_closure_sec: 1.7

temporal:
  yawn_window_sec: 120
  risk_window_sec: 60

scores:
  levels:
    attention_min: 31
    moderate_min: 61
    high_min: 71

  fatigue:
    perclos_reference: 0.35
    perclos_weight: 55.0
    yawn_reference_count: 1.0
    yawn_weight: 35.0
    long_closure_reference_count: 2.0
    long_closure_weight: 12.0
    active_long_closure_min_score: 20.0
    blink_duration_enabled: true
    blink_duration_reference_sec: 0.25
    blink_duration_weight: 7.0
    pupil_movement_enabled: true
    pupil_movement_reference: 0.05
    pupil_movement_min_samples: 10
    pupil_movement_weight: 8.0
    head_tilt_weight: 5.0

  final_decision:
    fatigue_high_min: 61

validation:
  classification:
    warmup_sec: 2
    low_vigilance_min_fatigue: 31
    low_vigilance_min_duration_sec: 2
    drowsy_min_fatigue: 50
    drowsy_min_duration_sec: 2

  event_detection:
    early_drowsiness_min_fatigue: 25
    drowsiness_min_fatigue: 50
    microsleep_min_perclos: 0.25
    no_face_max_valid_face_ratio: 0.75

alerts:
  sound_enabled: true
  cooldown_sec: 5

logging:
  enabled: true
  output_dir: "data/logs"
